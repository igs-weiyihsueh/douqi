<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鬥氣割草 - 2D關卡編輯器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* 頂部工具列 */
    #toolbar {
      height: 40px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
    }

    #toolbar .title {
      font-size: 14px;
      font-weight: 600;
      color: #4fc3f7;
      margin-right: 20px;
    }

    .toolbar-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .toolbar-separator {
      width: 1px;
      height: 24px;
      background: #333;
      margin: 0 8px;
    }

    .tb-btn {
      padding: 6px 12px;
      font-size: 12px;
      background: #0f3460;
      border: 1px solid #1a4a7a;
      color: #e0e0e0;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tb-btn:hover {
      background: #1a5276;
      border-color: #2a6a9a;
    }

    .tb-btn.active {
      background: #4fc3f7;
      color: #1a1a2e;
      border-color: #4fc3f7;
    }

    .tb-btn.primary {
      background: #1a5a1a;
      border-color: #2a7a2a;
    }

    .tb-btn.primary:hover {
      background: #2a7a2a;
    }

    /* 關卡選擇器樣式 */
    .level-selector {
      padding: 6px 12px;
      font-size: 11px;
      background: #0f3460;
      border: 1px solid #1a4a7a;
      color: #e0e0e0;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 120px;
      margin-right: 8px;
    }

    .level-selector:hover {
      background: #1a5276;
      border-color: #2980b9;
    }

    .level-selector:focus {
      outline: none;
      border-color: #3498db;
      background: #1a5276;
    }

    .level-selector option {
      background: #16213e;
      color: #e0e0e0;
      padding: 4px;
    }

    /* 主要內容區 */
    #main-content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* 左側面板 */
    #left-panel {
      width: 320px;
      min-width: 280px;
      max-width: 400px;
      background: #16213e;
      border-right: 1px solid #0f3460;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px;
      flex-shrink: 0;
    }

    /* 右側面板 */
    #right-panel {
      width: 280px;
      min-width: 200px;
      max-width: 500px;
      background: #16213e;
      border-left: 1px solid #0f3460;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px;
      flex-shrink: 0;
    }

    /* 中央畫布區域 */
    #canvas-area {
      flex: 1;
      position: relative;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    /* 遊戲預覽容器 */
    #game-preview {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000; /* 黑色背景用於邊框區域 */
    }

    /* 關卡選擇提示 */
    .level-prompt {
      text-align: center;
      color: #666;
      font-size: 18px;
      padding: 40px;
    }

    .level-prompt h3 {
      color: #999;
      font-size: 24px;
      margin-bottom: 16px;
    }

    .level-prompt p {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    /* 緊湊預覽區域 */
    .preview-container-small {
      width: 260px;
      height: 200px;
      border: 1px solid #0f3460;
      border-radius: 4px;
      background: #1a1a1a;
      position: relative;
      overflow: hidden;
    }

    #preview-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .preview-controls-small {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      padding: 6px;
      background: rgba(15, 52, 96, 0.3);
      border-radius: 4px;
    }

    .preview-btn {
      padding: 3px 6px;
      font-size: 10px;
      background: #0f3460;
      border: 1px solid #1a4a7a;
      color: #e0e0e0;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .preview-btn:hover {
      background: #1a5276;
    }

    .preview-info {
      font-size: 9px;
      color: #888;
    }

    .preview-help {
      margin-top: 4px;
      padding: 4px;
      background: rgba(15, 52, 96, 0.2);
      border-radius: 3px;
      text-align: center;
    }

    .preview-help small {
      color: #666;
      font-size: 8px;
    }

    #game-canvas {
      background: #2a2a2a; /* 與遊戲背景一致 */
      border: 1px solid #444;
      border-radius: 4px;
      display: block;
      /* Canvas置中的關鍵：移除預設margin */
      margin: 0;
    }

    /* 面板樣式 */
    .panel-section {
      margin-bottom: 20px;
      background: rgba(15, 52, 96, 0.3);
      border-radius: 6px;
      padding: 12px;
      border: 1px solid rgba(79, 195, 247, 0.1);
    }

    .panel-section h3 {
      font-size: 13px;
      color: #4fc3f7;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(79, 195, 247, 0.2);
      padding-bottom: 6px;
      font-weight: 600;
    }

    .panel-section.collapsed .section-content {
      display: none;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .collapse-btn {
      background: none;
      border: none;
      color: #4fc3f7;
      font-size: 12px;
      cursor: pointer;
    }

    /* 屬性行 */
    .prop-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
      flex-wrap: wrap;
    }

    .prop-row label {
      width: 70px;
      flex-shrink: 0;
      color: #aaa;
      font-size: 11px;
    }

    .prop-row input,
    .prop-row select,
    .prop-row textarea {
      flex: 1;
      min-width: 0;
      font-size: 11px;
      padding: 4px 6px;
      background: #0f3460;
      color: #e0e0e0;
      border: 1px solid #1a4a7a;
      border-radius: 3px;
    }

    .prop-row input[type="number"] {
      width: 70px;
      flex: unset;
    }

    .prop-row input[type="color"] {
      width: 40px;
      height: 24px;
      padding: 2px;
    }

    /* 實體調色板 */
    .entity-palette {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .entity-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px;
      background: rgba(15, 52, 96, 0.5);
      border: 1px solid #1a4a7a;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 10px;
    }

    .entity-item:hover {
      background: rgba(26, 82, 118, 0.7);
      border-color: #4fc3f7;
    }

    .entity-item.selected {
      background: rgba(79, 195, 247, 0.2);
      border-color: #4fc3f7;
    }

    .entity-icon {
      font-size: 18px;
      margin-bottom: 4px;
    }

    /* 物件列表 */
    .object-list {
      list-style: none;
    }

    .object-list li {
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 3px;
      font-size: 11px;
      border-left: 2px solid transparent;
      margin-bottom: 2px;
      background: rgba(15, 52, 96, 0.3);
    }

    .object-list li:hover {
      background: rgba(26, 82, 118, 0.5);
    }

    .object-list li.selected {
      background: rgba(15, 52, 96, 0.8);
      border-left-color: #4fc3f7;
    }

    /* 提示文字 */
    .hint {
      font-size: 10px;
      color: #666;
      margin-top: 4px;
      font-style: italic;
    }

    /* 狀態列 */
    #status-bar {
      height: 24px;
      background: #0f3460;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 11px;
      color: #888;
      flex-shrink: 0;
      border-top: 1px solid #1a4a7a;
    }

    /* 響應式調整 */
    @media (max-width: 1200px) {
      #left-panel, #right-panel {
        width: 240px;
      }
    }

    @media (max-width: 900px) {
      #left-panel, #right-panel {
        width: 200px;
      }
    }

    /* 滾動條樣式 */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1a1a2e;
    }

    ::-webkit-scrollbar-thumb {
      background: #4fc3f7;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #3ea6d6;
    }
  </style>
</head>
<body>
  <!-- 頂部工具列 -->
  <div id="toolbar">
    <span class="title">🎯 鬥氣割草 2D關卡編輯器</span>
    
    <div class="toolbar-group">
      <select class="level-selector" id="level-selector">
        <option value="">選擇關卡...</option>
      </select>
      <button class="tb-btn" id="btn-load">📂 載入</button>
      <button class="tb-btn" id="btn-save">💾 儲存</button>
      <button class="tb-btn" id="btn-load-level">📂 載入關卡</button>
      <button class="tb-btn" id="btn-manage">🗂️ 管理</button>
    </div>
    
    <div class="toolbar-separator"></div>
    
    <div class="toolbar-group">
      <button class="tb-btn" id="btn-add-enemy">🧟 +敵人</button>
      <button class="tb-btn" id="btn-add-item">💎 +道具</button>
      <button class="tb-btn" id="btn-add-obstacle">🧱 +障礙</button>
      <button class="tb-btn" id="btn-add-npc">🎭 +NPC</button>
    </div>
    
    <div class="toolbar-separator"></div>
    
    <div class="toolbar-group">
      <button class="tb-btn" id="btn-delete">🗑️ 刪除</button>
      <button class="tb-btn" id="btn-export">📤 匯出</button>
    </div>
    
    <div class="toolbar-separator"></div>
    
    <div class="toolbar-group">
      <button class="tb-btn primary" id="btn-test">🎮 測試關卡</button>
    </div>
  </div>

  <!-- 主要內容區 -->
  <div id="main-content">
    <!-- 左側面板 -->
    <div id="left-panel">
      <!-- 實體調色板 -->
      <div class="panel-section">
        <div class="section-header">
          <h3>🎯 實體調色板</h3>
          <button class="collapse-btn">−</button>
        </div>
        <div class="section-content">
          <div class="entity-palette">
            <div class="entity-item" data-type="enemy" data-subtype="basic">
              <div class="entity-icon">🧟</div>
              <div>基本敵人</div>
            </div>
            <div class="entity-item" data-type="enemy" data-subtype="fast">
              <div class="entity-icon">💨</div>
              <div>快速敵人</div>
            </div>
            <div class="entity-item" data-type="item" data-subtype="coin">
              <div class="entity-icon">💰</div>
              <div>金幣</div>
            </div>
            <div class="entity-item" data-type="item" data-subtype="gem">
              <div class="entity-icon">💎</div>
              <div>寶石</div>
            </div>
            <div class="entity-item" data-type="powerup" data-subtype="speed">
              <div class="entity-icon">⚡</div>
              <div>加速</div>
            </div>
            <div class="entity-item" data-type="powerup" data-subtype="attack">
              <div class="entity-icon">⚔️</div>
              <div>攻擊</div>
            </div>
            <div class="entity-item" data-type="obstacle" data-subtype="wall">
              <div class="entity-icon">🧱</div>
              <div>牆壁</div>
            </div>
            <div class="entity-item" data-type="obstacle" data-subtype="tree">
              <div class="entity-icon">🌳</div>
              <div>樹木</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 物件列表 -->
      <div class="panel-section">
        <div class="section-header">
          <h3>📋 場景物件</h3>
          <button class="collapse-btn">−</button>
        </div>
        <div class="section-content">
          <ul class="object-list" id="object-list">
            <!-- 動態生成 -->
          </ul>
          <div class="hint">點擊物件可選擇編輯</div>
        </div>
      </div>
    </div>

    <!-- 中央畫布區域 -->
    <div id="canvas-area">
      <!-- 遊戲預覽容器 -->
      <div id="game-preview" style="display: none;">
        <canvas id="game-canvas"></canvas>
      </div>
      
      <!-- 關卡選擇提示 -->
      <div class="level-prompt" id="level-prompt">
        <h3>🎯 選擇關卡開始編輯</h3>
        <p>請從上方下拉選單選擇要編輯的關卡</p>
        <p>選擇後將顯示該關卡的即時遊戲預覽</p>
      </div>
    </div>

    <!-- 右側面板 -->
    <div id="right-panel">
      <!-- 即時預覽 -->
      <div class="panel-section">
        <div class="section-header">
          <h3>🖼️ 即時預覽</h3>
          <button class="collapse-btn">−</button>
        </div>
        <div class="section-content">
          <div class="preview-container-small">
            <canvas id="preview-canvas"></canvas>
          </div>
          <div class="preview-controls-small">
            <div class="preview-info">
              <span id="entity-count">實體: 0</span> | 
              <span id="preview-zoom">80%</span>
            </div>
            <div>
              <button class="preview-btn" id="fit-view" title="適合視窗 (F)">📐</button>
              <button class="preview-btn" id="reset-camera" title="重置視角 (0)">🔄</button>
              <button class="preview-btn" id="zoom-out" title="縮小 (-)">−</button>
              <button class="preview-btn" id="zoom-in" title="放大 (+)">+</button>
            </div>
          </div>
          <div class="preview-help">
            <small>💡 滾輪縮放 | 拖拽平移 | Ctrl+滾輪精細縮放</small>
          </div>
        </div>
      </div>

      <!-- 關卡資訊 -->
      <div class="panel-section">
        <div class="section-header">
          <h3>🏗️ 關卡資訊</h3>
          <button class="collapse-btn">−</button>
        </div>
        <div class="section-content">
          <div class="prop-row">
            <label>關卡名稱</label>
            <input type="text" id="level-name" placeholder="輸入關卡名稱">
          </div>
          <div class="prop-row">
            <label>關卡描述</label>
            <textarea id="level-description" rows="2" placeholder="描述關卡內容"></textarea>
          </div>
          <div class="prop-row">
            <label>遊戲時間</label>
            <input type="number" id="game-time" value="300" min="10" max="3600">
            <span style="font-size: 10px; color: #888;">秒</span>
          </div>
          <div class="prop-row">
            <label>目標分數</label>
            <input type="number" id="target-score" value="1000" min="0">
          </div>
          <div class="prop-row">
            <label>難度等級</label>
            <select id="difficulty">
              <option value="easy">簡單</option>
              <option value="normal" selected>普通</option>
              <option value="hard">困難</option>
              <option value="expert">專家</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 出怪規則 -->
      <div class="panel-section">
        <div class="section-header">
          <h3>🧟 出怪規則</h3>
          <button class="collapse-btn">−</button>
        </div>
        <div class="section-content">
          <div class="prop-row">
            <label>出怪模式</label>
            <select id="spawn-mode">
              <option value="fixed">固定位置</option>
              <option value="random">隨機生成</option>
              <option value="wave">波次模式</option>
            </select>
          </div>
          <div class="prop-row">
            <label>最大存活</label>
            <input type="number" id="max-enemies" value="20" min="1" max="100">
          </div>
          <div class="prop-row">
            <label>生成間隔</label>
            <input type="number" id="spawn-interval" value="2" min="0.5" max="10" step="0.5">
            <span style="font-size: 10px; color: #888;">秒</span>
          </div>
          <div class="prop-row">
            <label>開始延遲</label>
            <input type="number" id="spawn-delay" value="3" min="0" max="30" step="0.5">
            <span style="font-size: 10px; color: #888;">秒</span>
          </div>
          <div class="hint">敵人類型分佈 (%)</div>
          <div class="prop-row">
            <label>基本敵人</label>
            <input type="number" id="basic-enemy-rate" value="70" min="0" max="100">
            <span style="font-size: 10px; color: #888;">%</span>
          </div>
          <div class="prop-row">
            <label>精英敵人</label>
            <input type="number" id="elite-enemy-rate" value="30" min="0" max="100">
            <span style="font-size: 10px; color: #888;">%</span>
          </div>
        </div>
      </div>

      <!-- Boss設定 -->
      <div class="panel-section">
        <div class="section-header">
          <h3>👹 Boss設定</h3>
          <button class="collapse-btn">−</button>
        </div>
        <div class="section-content">
          <div class="prop-row">
            <label>觸發方式</label>
            <select id="boss-trigger">
              <option value="none">無Boss</option>
              <option value="time">時間觸發</option>
              <option value="kill">擊殺數觸發</option>
              <option value="score">分數觸發</option>
            </select>
          </div>
          <div class="prop-row">
            <label>觸發值</label>
            <input type="number" id="boss-trigger-value" value="100" min="1">
          </div>
          <div class="prop-row">
            <label>Boss類型</label>
            <select id="boss-type">
              <option value="giant">巨型Boss</option>
              <option value="fast">快速Boss</option>
              <option value="tank">坦克Boss</option>
              <option value="mage">法師Boss</option>
            </select>
          </div>
          <div class="prop-row">
            <label>生成位置</label>
            <select id="boss-position">
              <option value="center">場地中心</option>
              <option value="random">隨機位置</option>
              <option value="custom">自定義</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 勝利條件 -->
      <div class="panel-section">
        <div class="section-header">
          <h3>🎯 勝利條件</h3>
          <button class="collapse-btn">−</button>
        </div>
        <div class="section-content">
          <div class="prop-row">
            <label>主要目標</label>
            <select id="primary-objective">
              <option value="score">達到目標分數</option>
              <option value="time">存活指定時間</option>
              <option value="kill">擊敗所有敵人</option>
              <option value="collect">收集所有道具</option>
            </select>
          </div>
          <div class="prop-row">
            <label>次要目標</label>
            <select id="secondary-objective">
              <option value="none">無</option>
              <option value="no-damage">不受傷害</option>
              <option value="time-limit">時間限制內完成</option>
              <option value="combo">達到連擊數</option>
            </select>
          </div>
          <div class="hint">完成主要目標即可過關，次要目標提供額外獎勵</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 狀態列 -->
  <div id="status-bar">
    <span id="status-text">就緒 - 開始設計你的關卡</span>
    <span style="margin-left: auto;" id="mouse-position">滑鼠: (0, 0)</span>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
