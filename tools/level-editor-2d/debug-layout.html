<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>容器診斷測試</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    
    .container {
      display: flex;
      height: 100vh;
    }
    
    .left { width: 320px; background: #16213e; }
    .center { 
      flex: 1; 
      background: #111; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      position: relative;
    }
    .right { width: 280px; background: #16213e; }
    
    #game-preview {
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #ff0000; /* 紅色邊框用於調試 */
    }
    
    canvas {
      background: #2a2a2a;
      border: 2px solid #00ff00; /* 綠色邊框用於調試 */
      display: block;
      margin: 0; /* 確保沒有預設margin */
    }
    
    .info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px;
      font-size: 12px;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left">左側面板</div>
    
    <div class="center">
      <div id="game-preview">
        <canvas id="game-canvas" width="800" height="450">Canvas not supported</canvas>
      </div>
      
      <div class="info" id="info">
        載入中...
      </div>
    </div>
    
    <div class="right">右側面板</div>
  </div>

  <script>
    function updateInfo() {
      const canvasArea = document.querySelector('.center');
      const gamePreview = document.getElementById('game-preview');
      const canvas = document.getElementById('game-canvas');
      const info = document.getElementById('info');
      
      const canvasAreaRect = canvasArea.getBoundingClientRect();
      const gamePreviewRect = gamePreview.getBoundingClientRect();
      const canvasRect = canvas.getBoundingClientRect();
      
      info.innerHTML = `
        <strong>容器診斷:</strong><br>
        Center Area: ${canvasAreaRect.width} × ${canvasAreaRect.height}<br>
        Game Preview: ${gamePreviewRect.width} × ${gamePreviewRect.height}<br>
        Canvas (設定): ${canvas.width} × ${canvas.height}<br>
        Canvas (顯示): ${canvasRect.width} × ${canvasRect.height}<br>
        比例: ${(canvas.width/canvas.height).toFixed(3)} (目標: 1.778)<br>
        填充率: ${(canvasRect.width/gamePreviewRect.width*100).toFixed(1)}% × ${(canvasRect.height/gamePreviewRect.height*100).toFixed(1)}%
      `;
    }
    
    // 初始更新和視窗大小變更時更新
    updateInfo();
    window.addEventListener('resize', updateInfo);
    
    // 每秒更新一次，確保數據準確
    setInterval(updateInfo, 1000);
  </script>
</body>
</html>
