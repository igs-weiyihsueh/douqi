<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3C大亂鬥 - H5版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #12131a;
      color: white;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #game { max-width: 100vw; max-height: 100vh; display: block; }
    
    .loading-container {
      position: absolute; 
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #12131a;
      z-index: 1000;
    }
    
    .loading-title {
      font-size: 32px;
      margin-bottom: 20px;
      color: #fff;
    }
    
    .loading-text {
      font-size: 18px;
      margin-bottom: 30px;
      color: #bbb;
    }
    
    .progress-bar {
      width: 300px;
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4aa3ff, #2ecc71);
      width: 0%;
      transition: width 0.3s ease;
    }
    
    .loading-spinner {
      width: 40px; height: 40px; margin-top: 20px;
      border: 4px solid #333; border-top: 4px solid #4aa3ff;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    
    @keyframes spin { 
      0% { transform: rotate(0deg); } 
      100% { transform: rotate(360deg); } 
    }
    
    .error-message {
      color: #ff4444;
      text-align: center;
      max-width: 500px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  
  <div class="loading-container" id="loadingContainer">
    <div class="loading-title">🎮 3C大亂鬥</div>
    <div class="loading-text" id="loadingText">正在載入遊戲...</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div style="font-size: 14px; color: #888; margin-bottom: 10px;">
      <span id="progressText">0%</span> - 請耐心等待
    </div>
    <div class="loading-spinner"></div>
  </div>
  
  <script>
    let progress = 0;
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const loadingText = document.getElementById('loadingText');
    const loadingContainer = document.getElementById('loadingContainer');
    
    // 模擬載入進度
    function updateProgress(percent, message) {
      progress = Math.min(100, Math.max(0, percent));
      progressFill.style.width = progress + '%';
      progressText.textContent = Math.round(progress) + '%';
      if (message) loadingText.textContent = message;
    }
    
    // 階段性載入進度
    updateProgress(10, '正在下載遊戲檔案...');
    
    setTimeout(() => updateProgress(30, '正在載入Phaser引擎...'), 500);
    setTimeout(() => updateProgress(60, '正在初始化遊戲系統...'), 1200);
    setTimeout(() => updateProgress(80, '正在創建遊戲場景...'), 2000);
    
    // 載入遊戲腳本
    const script = document.createElement('script');
    script.type = 'module';
    script.crossOrigin = '';
    script.src = './assets/main-Dv9zGArm.js';
    
    script.onload = function() {
      console.log('遊戲腳本載入成功');
      updateProgress(95, '準備進入遊戲...');
      
      // 給一點時間讓Phaser初始化
      setTimeout(() => {
        updateProgress(100, '載入完成！');
        setTimeout(() => {
          loadingContainer.style.opacity = '0';
          loadingContainer.style.transition = 'opacity 0.5s ease';
          setTimeout(() => {
            loadingContainer.style.display = 'none';
          }, 500);
        }, 500);
      }, 1000);
    };
    
    script.onerror = function(error) {
      console.error('載入錯誤:', error);
      loadingContainer.innerHTML = `
        <div class="loading-title">❌ 載入失敗</div>
        <div class="error-message">
          <p>很抱歉，遊戲載入過程中發生錯誤。</p>
          <p>請嘗試以下解決方案：</p>
          <ul style="text-align: left; margin: 20px 0;">
            <li>• 重新整理頁面</li>
            <li>• 檢查網路連線</li>
            <li>• 清除瀏覽器快取</li>
            <li>• 使用其他瀏覽器</li>
          </ul>
          <button onclick="window.location.reload()" 
                  style="background: #4aa3ff; color: white; border: none; 
                         padding: 10px 20px; border-radius: 5px; cursor: pointer;">
            重新載入
          </button>
        </div>
      `;
    };
    
    document.head.appendChild(script);
    
    // 超時保護（30秒後顯示提示）
    setTimeout(() => {
      if (loadingContainer.style.display !== 'none') {
        loadingText.innerHTML = '載入時間較長，請稍候...<br><small>大型遊戲首次載入需要一些時間</small>';
      }
    }, 30000);
  </script>
</body>
</html>
