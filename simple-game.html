<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3C大亂鬥</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #12131a;
      color: white;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #game { max-width: 100vw; max-height: 100vh; display: block; }
    .loading {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center; color: white; font-size: 18px;
      z-index: 1000;
    }
    .loading::after {
      content: ''; display: inline-block;
      width: 20px; height: 20px; margin-left: 10px;
      border: 2px solid #333; border-top: 2px solid #fff;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="game">
    <div class="loading" id="loading">載入中</div>
  </div>
  
  <!-- 動態載入遊戲腳本 -->
  <script type="module" crossorigin src="./assets/main-Dv9zGArm.js"></script>
</body>
</html>
