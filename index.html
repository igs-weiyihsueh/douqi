<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3C大亂鬥 - H5版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #12131a;
      color: white;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #game { max-width: 100vw; max-height: 100vh; display: block; }
    
    .loading-container {
      position: absolute; 
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #12131a;
      z-index: 1000;
    }
    
    .loading-title {
      font-size: 32px;
      margin-bottom: 20px;
      color: #fff;
    }
    
    .loading-text {
      font-size: 18px;
      margin-bottom: 30px;
      color: #bbb;
    }
    
    .progress-bar {
      width: 300px;
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4aa3ff, #2ecc71);
      width: 0%;
      transition: width 0.3s ease;
    }
    
    .loading-spinner {
      width: 40px; height: 40px; margin-top: 20px;
      border: 4px solid #333; border-top: 4px solid #4aa3ff;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    
    @keyframes spin { 
      0% { transform: rotate(0deg); } 
      100% { transform: rotate(360deg); } 
    }
    
    .error-message {
      color: #ff4444;
      text-align: center;
      max-width: 500px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  
  <div class="loading-container" id="loadingContainer">
    <div class="loading-title">🎮 3C大亂鬥</div>
    <div class="loading-text" id="loadingText">正在載入遊戲...</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div style="font-size: 14px; color: #888; margin-bottom: 10px;">
      <span id="progressText">0%</span> - 請耐心等待
    </div>
    <div class="loading-spinner"></div>
  </div>
  
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
