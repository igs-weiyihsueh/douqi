<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3C大亂鬥 - H5版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #12131a;
      color: white;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #game { max-width: 100vw; max-height: 100vh; display: block; }
    .loading {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center; color: white; font-size: 18px;
    }
    .loading::after {
      content: ''; display: inline-block;
      width: 20px; height: 20px; margin-left: 10px;
      border: 2px solid #333; border-top: 2px solid #fff;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #error { color: #ff4444; margin-top: 20px; }
  </style>
</head>
<body>
  <div id="game">
    <div class="loading" id="loading">載入中</div>
    <div id="error" style="display:none;"></div>
  </div>
  
  <script>
    // 簡單的錯誤處理和載入檢測
    console.log('開始載入遊戲...');
    
    window.addEventListener('error', function(e) {
      console.error('載入錯誤:', e);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').textContent = '載入失敗: ' + e.message;
    });
    
    // 檢測是否有遊戲引擎載入
    setTimeout(() => {
      if (!window.Phaser) {
        console.warn('Phaser未載入，嘗試回退載入...');
        document.getElementById('loading').textContent = '正在重新嘗試載入...';
        setTimeout(() => {
          window.location.reload();
        }, 2000);
      }
    }, 5000);
    
    // 動態載入遊戲腳本
    function loadGameScript() {
      const script = document.createElement('script');
      script.type = 'module';
      script.crossOrigin = '';
      
      // 嘗試載入最新的構建檔案
      const possibleScripts = [
        './assets/main-6JnEExNl-BUU9qgWQ-B-RR0brV.js',
        './assets/main-6JnEExNl-BUU9qgWQ.js',
        './assets/main-6JnEExNl.js'
      ];
      
      let scriptIndex = 0;
      
      function tryLoadScript() {
        if (scriptIndex >= possibleScripts.length) {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('error').style.display = 'block';
          document.getElementById('error').textContent = '無法載入遊戲檔案，請重新整理頁面';
          return;
        }
        
        script.src = possibleScripts[scriptIndex];
        console.log('嘗試載入:', script.src);
        
        script.onload = function() {
          console.log('遊戲腳本載入成功:', script.src);
        };
        
        script.onerror = function() {
          console.warn('載入失敗:', script.src);
          scriptIndex++;
          document.head.removeChild(script);
          setTimeout(tryLoadScript, 100);
        };
        
        document.head.appendChild(script);
      }
      
      tryLoadScript();
    }
    
    // 開始載入
    loadGameScript();
  </script>
</body>
</html>
